name: Pilot smoke
on:
  push:
    branches: ["sourcecraft/**", "poc/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
          enable-cache: true
      - run: bash scripts/pilot-check.sh smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-smoke-reports
          path: reports/pilot
