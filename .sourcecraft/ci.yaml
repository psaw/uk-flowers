on:
  push:
    - workflows: [pilot-checks]
      filter:
        branches: [main, "poc/**", "ai/**"]
  pull_request:
    - workflows: [pilot-checks]
      filter:
        target_branches: main

workflows:
  pilot-checks:
    tasks:
      - name: python-checks
        cubes:
          - name: bootstrap-and-verify
            script:
              - |
                set -eu
                mkdir -p .cache
                curl -fsSL https://astral.sh/uv/0.13.1/install.sh -o .cache/install-uv.sh
                UV_INSTALL_DIR="$PWD/.cache/uv-bin" UV_NO_MODIFY_PATH=1 sh .cache/install-uv.sh
                export PATH="$PWD/.cache/uv-bin:$PATH"
                export UV_PYTHON_INSTALL_DIR="$PWD/.cache/python"
                bash scripts/pilot-check.sh all
            artifacts:
              paths:
                - reports/pilot
